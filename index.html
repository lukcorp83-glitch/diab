<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <title>GlikoControl – Inteligentna Kontrola Cukrzycy</title>
    <link rel="canonical" href="https://glikocontrol.pl/" />
    <meta name="description" content="GlikoControl – Zaawansowana aplikacja do kontroli cukrzycy z asystentem AI, kalkulatorem bolusa, bazą żywności, analizą wkłuć i stoperem przedposiłkowym." />
    <meta name="keywords" content="cukrzyca, glikocontrol, kalkulator bolusa, t1d, cukrzyca typu 1, cgm, wymienniki węglowodanowe, ww, wbt, glikemia" />
    <meta property="og:title" content="GlikoControl – Inteligentna Kontrola Cukrzycy" />
    <meta property="og:description" content="Kalkulator bolusa, baza wymienników WW i WBT, sztuczna inteligencja GlikoSense oraz ochrona osprzętu i wkłuć." />
    <meta property="og:url" content="https://glikocontrol.pl" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://glikocontrol.pl/pwa-icon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlikoControl – Inteligentna Kontrola Cukrzycy" />
    <meta name="twitter:description" content="Zaawansowana aplikacja dla diabetyków z kalkulatorem bolusa, AI i bazą wymienników." />
    <script>
      // W środowisku Capacitor Android/iOS WebView ServiceWorker nie jest używany i wyrzuca błędy przy rejestracji
      try {
        if (window.location.protocol === 'capacitor:' || (window.location.hostname === 'localhost' && /Android|iPhone|iPad/i.test(navigator.userAgent))) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register = function() {
              return Promise.resolve({
                scope: './',
                unregister: function() { return Promise.resolve(true); }
              });
            };
          }
        }
      } catch (e) {}

      // Globalny ratunkowy wychwytywacz błędów JS na telefonie
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var strMsg = msg ? String(msg) : '';
        if (strMsg.indexOf('ServiceWorker') !== -1 || strMsg.indexOf('service worker') !== -1 || strMsg.indexOf('sw.js') !== -1) {
          console.warn('[SW Warning ignored]:', strMsg);
          return true;
        }
        var errDiv = document.getElementById('fatal-error-overlay');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'fatal-error-overlay';
          errDiv.style.cssText = 'position:fixed;inset:0;background:#0f172a;color:#f43f5e;padding:24px;z-index:999999;font-family:monospace;font-size:12px;overflow:auto;display:flex;flex-direction:column;gap:12px;';
          errDiv.innerHTML = '<h2 style="font-size:18px;font-weight:bold;color:#fff;">⚠️ Błąd uruchomienia aplikacji:</h2><pre id="fatal-error-msg" style="white-space:pre-wrap;background:#1e293b;padding:12px;border-radius:8px;border:1px solid #334155;color:#fca5a5;"></pre><button onclick="localStorage.clear();location.reload();" style="padding:12px 20px;background:#ef4444;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin-top:10px;">Wyczyść pamięć i przeładuj</button>';
          document.body ? document.body.appendChild(errDiv) : document.documentElement.appendChild(errDiv);
        }
        var msgEl = document.getElementById('fatal-error-msg');
        if (msgEl) {
          msgEl.textContent = (msg || '') + '\n\nPlik: ' + (url || '') + ':' + lineNo + ':' + columnNo + (error && error.stack ? '\n\n' + error.stack : '');
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        var reason = event.reason || {};
        var msg = reason.message || String(reason || '');
        if (msg.indexOf('ServiceWorker') !== -1 || msg.indexOf('service worker') !== -1 || msg.indexOf('sw.js') !== -1) {
          console.warn('[SW Warning ignored]:', msg);
          return;
        }
        window.onerror(msg, '', 0, 0, reason);
      };
    </script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (!theme) {
            var userSettings = localStorage.getItem('glikocontrol_user_settings');
            if (userSettings) {
              try { theme = JSON.parse(userSettings).theme; } catch(e) {}
            }
          }
          if (!theme) {
            var stored = localStorage.getItem('app-storage');
            if (stored) {
              try { theme = JSON.parse(stored).state?.theme; } catch(e) {}
            }
          }
          var isDark = theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || (theme === 'system' && ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || (new Date().getHours() >= 20 || new Date().getHours() < 7)));
          if (isDark || !theme) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#020617';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f4f5f7';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#020617';
        }
      })();
    </script>
  </head>
  <body class="bg-[#020617] dark:bg-[#020617] text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
